name = "lx-music-api-server"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
# 不写 account_id：使用 wrangler 登录的账号(多个账号时可以设置环境变量 CLOUDFLARE_ACCOUNT_ID)，
# 这样“一键部署到 Cloudflare”按钮也能部署到任何人的账号

# 管理后台和首页的静态文件(public/static)，由 Cloudflare 直接提供，不经过 Worker
[assets]
directory = "./public"

# 音源脚本模板、建表语句作为文本打包进 Worker
[[rules]]
type = "Text"
globs = ["**/*.txt", "**/*.sql"]
fallthrough = true

# D1 数据库：配置、用户、解析记录、定时任务状态、缓存都保存在这里，表结构会在第一次请求时自动创建/升级。
# 不写 database_id：部署时 wrangler 会沿用 Worker 已经绑定的数据库，没有的话使用账号里名为 lx-music-api-db 的数据库，
# 再没有就自动新建一个(一键部署、Workers Builds 自动部署都适用)。也可以填上自己的 database_id 固定使用某个数据库
[[d1_databases]]
binding = "DB"
database_name = "lx-music-api-db"

# 每分钟触发一次：执行到期的刷新登录、签到、清理任务(各任务按自己的间隔执行，失败后退避重试)，
# 每 5 分钟检查一次各平台状态
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# 首个管理员的用户名；密码是 Secret(ADMIN_PASSWORD)，一键部署时会提示填写，
# 也可以执行 npx wrangler secret put ADMIN_PASSWORD 设置。两者都只在数据库里还没有管理员时生效
[vars]
ADMIN_USERNAME = "admin"
