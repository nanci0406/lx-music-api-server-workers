account_id = "e236b337f981bb243c63be7302da1325"
name = "lx-music-api-server"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# D1 数据库绑定
[[d1_databases]]
binding = "DB"
database_name = "lx-music-api-db"
database_id = "482d7557-dca5-41f9-9277-1e3533f7ebd5"

# KV 命名空间绑定
[[kv_namespaces]]
binding = "KV"
id = "5aa4c70e42de496db7975ba8693785d6"

# 定时任务配置
[triggers]
crons = [
  "7 0 * * *",    # 每天 00:07 - 酷狗签到（每天一次）
  "7 0 */7 * *",  # 每7天 00:07 - 酷狗刷新登录（每7天一次）
  "13 0 */3 * *", # 每3天 00:13 - QQ音乐刷新登录
  "19 0 */7 * *"  # 每7天 00:19 - 网易云刷新登录
]

# 环境变量（开发环境）
[vars]
AUTH_ENABLED = "true"
ENVIRONMENT = "production"
